[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-rag-system"
version = "0.1.0"
description = "Business Document RAG System for Learning"
requires-python = ">=3.10"

# Essential dependencies
dependencies = [
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "python-multipart>=0.0.9",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",             # For token counting
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",         # For similarity metrics
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.0.155",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 88
