
services:
  # Development environment for FastAPI + LLM
  rag-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-dev
    ports:
      - "8080:8001"   # host:container
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./documents:/app/documents
      - ./data:/app/data
      - ./uploads_data:/app/data/uploads
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      # Vector DB settings (ChromaDB)
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
      # LLM provider (provider-agnostic): LLM_PROVIDER picks the provider; the
      # generic LLM_* vars fall back to the legacy KIMI_* ones so existing .env
      # files keep working. See .env.example.
      - LLM_PROVIDER=${LLM_PROVIDER:-kimi}
      - LLM_API_KEY=${LLM_API_KEY:-${KIMI_API_KEY:-}}
      - LLM_BASE_URL=${LLM_BASE_URL:-${KIMI_BASE_URL:-https://api.moonshot.cn/v1}}
      - LLM_MODEL=${LLM_MODEL:-${KIMI_MODEL:-moonshot-v1-8k}}

    stdin_open: true
    tty: true
    networks:
      - rag-network
    depends_on:
      # The RAG code uses ChromaDB's embedded PersistentClient (see
      # vector_store.py) and never connects to the server service, so don't
      # block rag-dev startup on the server's health. The service is still
      # started for convenience (Chroma web UI / future server mode).
      - chromadb


  #ChromaDB for vector storage
  chromadb:
    image: chromadb/chroma:latest
    container_name: business-rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      # Auth was removed: CHROMA_SERVER_AUTH_CREDENTIALS_FILE pointed at
      # /chroma/auth.txt but no such file was ever mounted, so the container
      # failed to start. The RAG code uses the embedded PersistentClient anyway
      # (it never connects to this server), so auth here only blocks startup.
      # Re-add with a real credentials file if you ever switch to server mode.
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  rag-network:
    driver: bridge

volumes:
  chromadb_data:
    name: business-rag-chromadb-data
