
services:
  # Development environment for FastAPI + LLM
  rag-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-dev
    ports:
      - "8080:8001"   # host:container
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./documents:/app/documents
      - ./data:/app/data
      - ./uploads_data:/app/data/uploads
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      # Vector DB settings (ChromaDB)
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview

    stdin_open: true
    tty: true
    networks:
      - rag-network
    depends_on:
      chromadb:
        condition: service_healthy


  #ChromaDB for vector storage
  chromadb:
    image: chromadb/chroma:latest
    container_name: business-rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/auth.txt
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.basic.BasicAuthCredentialsProvider
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  rag-network:
    driver: bridge

volumes:
  chromadb_data:
    name: business-rag-chromadb-data
