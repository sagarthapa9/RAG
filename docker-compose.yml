  #   profiles:
  #     - metadata-db
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_metadata"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

networks:
  rag-network:
    driver: bridge
    name: business-rag-network

volumes:
  chromadb_data:
    name: business-rag-chromadb-data
  qdrant_data:
    name: business-rag-qdrant-data
  postgres_data:
    name: business-rag-postgres-data